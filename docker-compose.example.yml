services:
  reverse:
    build:
      context: .
    image: reverse-server:local
    container_name: reverse-server
    command:
      - --server
      - --server-config
      - /etc/reverse/server.json
    network_mode: host
    restart: unless-stopped
    stop_grace_period: 15s
    pids_limit: 256
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - SETGID
      - SETPCAP
      - SETUID
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    labels:
      io.reverse.managed: "true"
    volumes:
      - /etc/reverse/server.json:/etc/reverse/server.json:ro,Z
